{% extends "base.html" %}

{% block title %}학생 회원가입 - 율전중앙교회 달란트 포털{% endblock %}

{% block content %}
<div style="max-width: 520px; margin: 2rem auto;">
  <div class="card" style="padding: 2.2rem 2rem;">
    <div style="text-align: center; margin-bottom: 1.5rem;">
      <div style="font-size: 2.8rem; margin-bottom: 0.4rem;">📝</div>
      <h2 style="color: #1e3a8a; font-weight: 800;">학생 신규 가입 신청</h2>
      <p style="color: var(--text-muted); font-size: 0.9rem;">
        가입 정보를 입력하면 고유 ID가 발급되며, 교사 승인 후 즉시 사용 가능합니다.
      </p>
    </div>

    <form action="/student/register" method="POST" enctype="multipart/form-data">
      <!-- 필수 항목 -->
      <div style="background: #eff6ff; border: 1px solid #bfdbfe; border-radius: var(--radius-sm); padding: 1rem; margin-bottom: 1.2rem;">
        <div style="font-size: 0.85rem; font-weight: 700; color: #1e40af; margin-bottom: 0.6rem;">📌 필수 입력 사항</div>
        <div class="form-group">
          <label class="form-label" for="name">이름 <span style="color: red;">*</span></label>
          <input type="text" id="name" name="name" class="form-control" placeholder="학생 실명 입력" required>
        </div>
        <div class="form-group" style="margin-bottom: 0;">
          <label class="form-label" for="password">사용할 비밀번호 <span style="color: red;">*</span></label>
          <input type="password" id="password" name="password" class="form-control" placeholder="비밀번호 설정" required>
        </div>
      </div>

      <!-- 선택 및 사진 항목 -->
      <div style="background: #f8fafc; border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 1rem; margin-bottom: 1.2rem;">
        <div style="font-size: 0.85rem; font-weight: 700; color: #475569; margin-bottom: 0.6rem;">📷 프로필 사진 및 추가 정보 (선택)</div>

        <div class="form-group">
          <label class="form-label" for="photo">학생 프로필 사진</label>
          <input type="file" id="photo" name="photo" class="form-control" accept="image/*">
          <small style="color: var(--text-muted); font-size: 0.8rem;">사진을 등록하면 매점 키오스크 화면에 본인 사진이 크게 나타납니다.</small>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.8rem;">
          <div class="form-group">
            <label class="form-label" for="department">소속 부서</label>
            <select id="department" name="department" class="form-control">
              <option value="">부서 선택</option>
              <option value="유치부">유치부</option>
              <option value="아동부" selected>아동부</option>
              <option value="청소년부">청소년부</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label" for="age">나이</label>
            <input type="number" id="age" name="age" class="form-control" placeholder="예: 12">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="gender">성별</label>
          <select id="gender" name="gender" class="form-control">
            <option value="">성별 선택</option>
            <option value="M">남학생</option>
            <option value="F">여학생</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label" for="phone">연락처 (휴대폰)</label>
          <input type="tel" id="phone" name="phone" class="form-control" placeholder="010-0000-0000">
        </div>

        <div class="form-group" style="margin-bottom: 0;">
          <label class="form-label" for="email">이메일</label>
          <input type="email" id="email" name="email" class="form-control" placeholder="example@email.com">
        </div>
      </div>

      <button type="submit" class="btn btn-primary btn-lg" style="width: 100%;">
        가입 신청 완료 ➔
      </button>
    </form>
  </div>
</div>
{% endblock %}
